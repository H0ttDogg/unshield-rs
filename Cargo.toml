[package]
name = "unshield-rs"
version = "1.6.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Rust implementation of InstallShield cabinets with the libunshield C ABI"

[lib]
name = "unshield"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "unshield-rs"
path = "src/main.rs"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
md5 = "0.8"
libc = "0.2"

[dev-dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
